<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>netflix</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/netflix.css">
    <style>

    </style>
</head>
<body> 
    <div class="background">
    <header>
        <img src="../images/Netflix_logo.png" alt="넷플릭스">
        <div>
            <select>
                <option value="ko">한국어</option>
                <option value="en">Enlglish</option>
            </select>
            <button type="button">로그인</button>
        </div>
    </header>

    <main>
        <h1>영화, 시리즈 등을 무제한으로</h1>
        <h2>7,000원으로 시작하세요. 멤버십은 언제든지 해지 가능합니다.</h2>  
        <p> 
            시청할 준비가 되셨나요? 멤버십을 등록하거나 재시작하려면<br>
            이메일 주소를 입력하세요
        </p>
        <div class="emailform">
            <input type="email" placeholder="이메일 주소">
            <button class="start-btn">시작하기</button>
        </div>
    </main> 

    <article class="more">
        <div class="title-group">
            <h2>7,000원이면 만날 수 있는 넷플릭스</h2>
            <p>몇 개의 중간 광고와 함께 요금도 절약하고 넷플릭스고 즐겨보세요.</p>
        </div>
        <a href="#">자세히 알아보기</a>
    </article> 

    <article class="content">
        <h3>지금 뜨는 콘텐츠</h3>
        <ol>
            <ul>
                <img src="./images/케이팝 데몬헌터스" alt="1순위">
            </ul>
        </ol>
    </article>

    <article class="reason">
        <h3>가입해야하는 또 다른 이유</h3>
        <strong>TV로 즐기세요</strong>
        <P>스마트 TV, PlayStation, Xbox, Chromecast, Apple TV, 블루레이 플레이어 등 다양한 서비스에서 시청하세요.</P>
    </article>
    
</div>
</body>
</html>
