<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="./css/reset.css">
    <style>

        .box1 {
            background-color: gold;
            height: 150px;
        }

        .box1:hover img {
            translate: 200px;
            scale: 1.5;
            rotate: 1080deg;
        }
 
            /* transition-property: all;
            transition-duration: 마우스를 올리면 효과 적요 
            transition-delay: 마우스를 떼고 시간이 지난 후 효과 적용
            transition-timing-function 애니메이션 효과 준다  */


        img {
            width: 90px;
            transition: translate 0.5s, scale 0.5s 0.5s, rotate 0.5s 1s
        }

        p {
            transition: 0.5s;
            opacity: 0;
            translate: 0 30px;
            background-color: rgb(139, 147, 155);
        }

        .box1:hover p {
            opacity: 1;
            translate: 0 0;
            background-color: rgb(203, 203, 203);
        }

        .thumb {
            width: 200px;
            height: 170px;
            overflow: hidden;
            border-radius: 12px;
            margin: 50px auto;
            border: 1px solid red;
            box-shadow: 0 0 15px rgb(0, 0, 0, 0.5);
        }

        .thumb:hover {
            box-shadow: 10px 10px 30px rgb(0, 0, 0, 0.8);
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

     
    </style>



</head>
<body>
    <div class="thumb">
        <img src="./images/irangi_4.png" alt="사진2">
    </div>
    <div class="box1">
        <p>Hello Transition</p>
        <img src="./images/irangi_0.png" alt="사진">
    </div>
    
</body>
</html>
