<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>아래에서 좋아하는 과목을 모두 선택하세요</p>

    <!-- 체크박스 마크업 아래같이 할 경우 글자 눌러도 체크박스에 표시됨 -->
    <!-- 명시적인 레이블(웹접근성이 가장 좋음) -->
    <!-- input은 중복선택이 가능하나 데이터를 전달할 때 같은 항목임을 인식하기 위해서 name이 들어가야함 -->
    <input type="checkbox" id="subject-1" name="subject"><label for="subject-1">HTML</label><br> 
    <input type="checkbox" id="subject-2" name="subject"><label for="subject-2">CSS</label><br> 
    <input type="checkbox" id="subject-3" name="subject"><label for="subject-3">JAJVASCRIPT</label>
    
    <p>자동로그인 설정하기</p>
    <!-- 암묵적인 레이블 label 태그로 묶어버려도 됨 -->
    <label><input type="checkbox">자동로그인</label>
    <!-- 명시적인 레이블 -->
    <input type="checkbox" id="autologin"><label for="autologin">자동로그인</label>

    <p>평가를 해주세요</p>
    <!-- 중복선택 하면 안되기 때문에 name="judgement"를 넣어줌으로써 중복선택이 안되도록 한다 -->
    <label><input type="radio" name="judgement">좋아요</label>
    <input type="radio" id=radio name="judgement"><label for="radio">싫어요</label>

    <!-- 중복선택 하면 안되기 때문에 name="gender"를 넣어줌으로써 중복선택이 안되도록 한다 -->
    <p>성별을 선택해주세요</p>
    <label><input type="radio" name="gender" value="man"><span>남성</span></label> <!--간격 같은 설정을 편하게 하기 위해 span을 넣어준다-->
    <label><input type="radio" name="gender" value="woman" checked><span>여성</span></label> <!--checked로 여성에 미리 체크되어있게 하겠다-->
    <label><input type="radio" name="gender" value="etc"><span>기타</span></label>

    <p>메모를 남겨주세요</p>
    <label for="memo">MEMO입력</label>
    <input type="text" id="memo" name="memo" placeholder="메모를 입력하세요">




</body>
</html>
