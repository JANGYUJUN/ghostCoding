<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/table.css">
</head>
<body>
    <table>
        <tr>
            <td rowspan="7">주주구성비율</td>
            <!-- row(행)span(병합)="7"은 행이 1개인데 7개로 병합하라는 의미이다. -->
            <td>구분</td> 
            <td>주식수</td> 
            <td>비율</td> 
        </tr>
        <tr>
            <td>최대주주 및 특수관계인</td> 
            <td>106,888,888</td> 
            <td>24.1</td> 
        </tr>
        <tr>
            <td>외국인</td> 
            <td>117,805,038</td> 
            <td>26.5</td> 
        </tr>
        <tr>
            <td>국내기관</td> 
            <td>66,338,970</td> 
            <td>14.9</td> 
        </tr>
        <tr>
            <td>개인 및 기타법인</td> 
            <td>148,537,459</td> 
            <td>33.5</td> 
        </tr>
        <tr>
            <td>자사주</td> 
            <td>2,423,783</td> 
            <td>0.5</td> 
        </tr>
        <tr>
            <td colspan="2">Total</td> 
            <!--col(열)span(병합)="2"은 셀이 한개인데 두개로 인식하라는 말임-->
            <td>99.5%</td>
        
        </tr>
        
    </table>

    <table>
        <tr>
            <td>A</td>
            <td>B</td>
        </tr>
        <tr>
            <td>C</td>
            <td>D</td>
        </tr>
    </table>

      <table>
        <tr>
            <td>A</td>
            <td>B</td>
        </tr>
        <tr>
            <td colspan="2">C</td>
        </tr>
    </table>

     <table>
        <tr>
            <td rowspan="2">A</td>
            <td>B</td>
        </tr>
        <tr>
            <td>C</td>
        </tr>
    </table>


</body>
</html>
